services:
  # Option 1: Unified Fullstack Service (Single-Service Deploy - Free Tier Friendly)
  - type: web
    name: eventra-app
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        value: '*'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Eventra <onboarding@resend.dev>
      - key: STRIPE_SECRET_KEY
        sync: false
